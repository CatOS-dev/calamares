defaultFileSystemType: ext4
availableFileSystemTypes: [btrfs, ext4]
userSwapChoices: [none, file]
initialSwapChoice: none
allowManualPartitioning: false
bootloaderProfiles:
  grub:
    platforms:
      - firmware: efi
        architectures: [x86_64]
      - firmware: bios
        architectures: [x86_64]
    partition:
      efi:
        mountPoint: /boot/efi
        recommendedSize: 300MiB
        minimumSize: 300MiB
      biosBootPartition: gpt-only
    snapshots:
      manager: snapper
      requiredFileSystems: [btrfs]
  limine:
    platforms:
      - firmware: efi
        architectures: [x86_64]
      - firmware: bios
        architectures: [x86_64]
    partition:
      efi:
        mountPoint: /boot/efi
        recommendedSize: 2GiB
        minimumSize: 1GiB
      requiredPartitionTableType: [gpt]
    snapshots:
      manager: snapper
      requiredFileSystems: [btrfs]
